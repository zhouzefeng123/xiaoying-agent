      <path d="M0 14v21" stroke="#4b9cff" stroke-width="5"/>
      <circle cx="0" cy="0" r="12" fill="#fff7c7" stroke="#ffd76c" stroke-width="4"/>
    </g>

    <path d="M54 96h276c23 0 42 19 42 42v118c0 24-19 43-42 43H54c-23 0-42-19-42-43V138c0-23 19-42 42-42Z" fill="url(#robotShell)" stroke="#4d8fd7" stroke-width="5" filter="url(#shadow)"/>
    <rect x="34" y="116" width="316" height="150" rx="55" fill="#0b1e37" stroke="#2f6fa8" stroke-width="4"/>
    <rect x="62" y="133" width="260" height="116" rx="42" fill="#08182d"/>
    <path d="M58 189c23-55 62-82 116-82h24c54 0 94 27 116 82" fill="none" stroke="#3d83bd" stroke-width="3" opacity="0.75"/>

    <g>
      <ellipse cx="145" cy="190" rx="17" ry="23" fill="#69efff"/>
      <ellipse cx="145" cy="190" rx="8" ry="18" fill="#e2ffff" opacity="0.7"/>
      <ellipse cx="239" cy="190" rx="17" ry="23" fill="#69efff"/>
      <ellipse cx="239" cy="190" rx="8" ry="18" fill="#e2ffff" opacity="0.7"/>
    </g>
    <path d="M178 224c9 10 19 10 28 0" fill="none" stroke="#ffb45c" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="105" cy="224" rx="11" ry="5" fill="#f49ab6" opacity="0.85"/>
    <ellipse cx="279" cy="224" rx="11" ry="5" fill="#f49ab6" opacity="0.85"/>

    <path d="M21 160c-18 7-25 28-25 52s7 45 25 52l12-13v-78l-12-13Z" fill="#86beff" stroke="#3979c8" stroke-width="4"/>
    <path d="M363 160c18 7 25 28 25 52s-7 45-25 52l-12-13v-78l12-13Z" fill="#86beff" stroke="#3979c8" stroke-width="4"/>
    <path d="M2 181v60" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M382 181v60" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M67 298c-10 18-5 44 17 48 10 2 16-7 22-18l-39-30Z" fill="url(#robotShell)" stroke="#3979c8" stroke-width="4"/>
    <path d="M317 298c10 18 5 44-17 48-10 2-16-7-22-18l39-30Z" fill="url(#robotShell)" stroke="#3979c8" stroke-width="4"/>

    <g transform="translate(270 34)">
      <rect width="93" height="62" rx="14" fill="#102a43" stroke="#2c617e" filter="url(#shadow)"/>
      <circle cx="17" cy="17" r="5" fill="#64e6d4"/>
      <text x="29" y="21" fill="#dff8f3" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600">Agent</text>
      <rect x="14" y="34" width="61" height="5" rx="2.5" fill="#6388a4"/>
      <rect x="14" y="45" width="43" height="5" rx="2.5" fill="#31536f"/>
    </g>
    <g transform="translate(-54 267)">
      <rect width="108" height="62" rx="14" fill="#102a43" stroke="#2c617e" filter="url(#shadow)"/>
      <circle cx="17" cy="17" r="5" fill="#ffd478"/>
      <text x="29" y="21" fill="#fff1cf" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600">Tools</text>
      <rect x="14" y="34" width="75" height="5" rx="2.5" fill="#6388a4"/>
      <rect x="14" y="45" width="49" height="5" rx="2.5" fill="#31536f"/>
    </g>
  </g>

  <path d="M720 72c36-18 69-19 104-4" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.45"/>
  <path d="M738 350c44 20 85 18 124-7" fill="none" stroke="#5d9bd0" stroke-width="1.5" opacity="0.3"/>
</svg>
