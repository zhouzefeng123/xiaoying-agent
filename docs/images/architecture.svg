<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">XiaoYing Agent 系统架构</title>
  <desc id="archDesc">浏览器或桌面客户端通过 Vite 或 Nginx 访问 Go API，并连接 MySQL、工作区以及模型、MCP 和 LSP 服务。</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#edf6fb"/>
    </linearGradient>
    <linearGradient id="clientCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d2a46"/>
      <stop offset="1" stop-color="#163f5f"/>
    </linearGradient>
    <linearGradient id="apiCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0c5b66"/>
      <stop offset="1" stop-color="#0a7b82"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#21b7a7"/>
      <stop offset="1" stop-color="#398ee8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6f9ebd"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#153f5f" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="780" rx="26" fill="url(#canvas)"/>
  <circle cx="1110" cy="74" r="122" fill="#55c8bc" opacity="0.08"/>
  <circle cx="72" cy="710" r="150" fill="#4c97e8" opacity="0.07"/>

  <text x="58" y="68" fill="#143653" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="30" font-weight="800">XiaoYing Agent · 系统架构</text>
  <text x="60" y="96" fill="#69849a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">单仓库前后端分离 · Web 与 Desktop 双端 · Docker 自托管</text>
  <rect x="992" y="45" width="152" height="34" rx="17" fill="#ffffff" stroke="#c9dde9"/>
  <circle cx="1013" cy="62" r="4" fill="#20b5a6"/>
  <text x="1026" y="67" fill="#466b82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">Go + React</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <g transform="translate(60 132)">
      <rect width="1080" height="110" rx="18" fill="#ffffff" stroke="#d8e7f0" filter="url(#shadow)"/>
      <text x="24" y="28" fill="#8b9cac" font-size="11" font-weight="700" letter-spacing="1.3">CLIENT</text>
      <g transform="translate(24 47)">
        <rect width="300" height="42" rx="10" fill="#eff7fc"/>
        <circle cx="23" cy="21" r="9" fill="#2f8cd9"/>
        <text x="42" y="26" fill="#234b68" font-size="14" font-weight="700">浏览器 Web 客户端</text>
      </g>
      <g transform="translate(342 47)">
        <rect width="300" height="42" rx="10" fill="#eff7fc"/>
        <circle cx="23" cy="21" r="9" fill="#2e67c5"/>
        <text x="42" y="26" fill="#234b68" font-size="14" font-weight="700">Electron 桌面客户端</text>
      </g>
      <g transform="translate(660 47)">
        <rect width="388" height="42" rx="10" fill="#f7fafc"/>
        <text x="20" y="26" fill="#5b768a" font-size="13">React 19 · TypeScript · Monaco · xterm.js</text>
      </g>
    </g>

    <path d="M600 242V285" stroke="#6f9ebd" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(160 288)">
      <rect width="880" height="102" rx="18" fill="#ffffff" stroke="#d8e7f0" filter="url(#shadow)"/>
      <text x="24" y="27" fill="#8b9cac" font-size="11" font-weight="700" letter-spacing="1.3">WEB GATEWAY</text>
      <g transform="translate(24 44)">
        <rect width="384" height="42" rx="10" fill="url(#clientCard)"/>
        <text x="20" y="26" fill="#e7f5ff" font-size="14" font-weight="700">Vite Dev Server</text>
        <text x="175" y="26" fill="#9cc5e3" font-size="12">/v1 · /health · WebSocket 代理</text>
      </g>
      <g transform="translate(430 44)">
        <rect width="426" height="42" rx="10" fill="url(#clientCard)"/>
        <text x="20" y="26" fill="#e7f5ff" font-size="14" font-weight="700">Nginx（Docker）</text>
        <text x="185" y="26" fill="#9cc5e3" font-size="12">静态资源 · Basic Auth · 反向代理</text>
      </g>
    </g>

    <path d="M600 390V433" stroke="#6f9ebd" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(100 436)">
      <rect width="1000" height="180" rx="20" fill="url(#apiCard)" filter="url(#shadow)"/>
      <text x="26" y="32" fill="#a9e7e4" font-size="11" font-weight="700" letter-spacing="1.3">GO API · PORT 3000</text>
      <text x="26" y="62" fill="#ffffff" font-size="21" font-weight="800">Agent Server</text>
      <text x="26" y="84" fill="#b5e1df" font-size="12">认证、会话、模型路由、工具执行与实时事件</text>

      <g transform="translate(315 23)" fill="#0b6870" stroke="#4ba9ab">
        <rect x="0" y="0" width="130" height="55" rx="11"/>
        <rect x="142" y="0" width="130" height="55" rx="11"/>
        <rect x="284" y="0" width="130" height="55" rx="11"/>
        <rect x="426" y="0" width="130" height="55" rx="11"/>
        <rect x="568" y="0" width="92" height="55" rx="11"/>
      </g>
      <g transform="translate(315 23)" fill="#ddf8f5" font-size="13" font-weight="700" text-anchor="middle">
        <text x="65" y="24">Auth / User</text>
        <text x="65" y="41" fill="#88d7d1" font-size="10" font-weight="500">Email · Cookie</text>
        <text x="207" y="24">Agent Core</text>
        <text x="207" y="41" fill="#88d7d1" font-size="10" font-weight="500">Plan · Tools</text>
        <text x="349" y="24">Sessions</text>
        <text x="349" y="41" fill="#88d7d1" font-size="10" font-weight="500">Context · Memory</text>
        <text x="491" y="24">Model Router</text>
        <text x="491" y="41" fill="#88d7d1" font-size="10" font-weight="500">User Models</text>
        <text x="614" y="24">Swarm</text>
        <text x="614" y="41" fill="#88d7d1" font-size="10" font-weight="500">Tasks</text>
      </g>

      <g transform="translate(26 112)" font-size="11">
        <rect width="200" height="42" rx="9" fill="#07535b" stroke="#3b989d"/>
        <text x="15" y="18" fill="#c9f2ee" font-weight="700">/v1/chat/completions</text>
        <text x="15" y="33" fill="#77cbc6">流式对话</text>
        <rect x="214" width="200" height="42" rx="9" fill="#07535b" stroke="#3b989d"/>
        <text x="229" y="18" fill="#c9f2ee" font-weight="700">/v1/ws</text>
        <text x="229" y="33" fill="#77cbc6">WebSocket 事件</text>
        <rect x="428" width="200" height="42" rx="9" fill="#07535b" stroke="#3b989d"/>
        <text x="443" y="18" fill="#c9f2ee" font-weight="700">/v1/user-models</text>
        <text x="443" y="33" fill="#77cbc6">用户模型管理</text>
        <rect x="642" width="200" height="42" rx="9" fill="#07535b" stroke="#3b989d"/>
        <text x="657" y="18" fill="#c9f2ee" font-weight="700">/health</text>
        <text x="657" y="33" fill="#77cbc6">服务健康检查</text>
      </g>
    </g>

    <path d="M600 616V658" stroke="#6f9ebd" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(60 660)">
      <rect width="1080" height="94" rx="18" fill="#ffffff" stroke="#d8e7f0" filter="url(#shadow)"/>
      <text x="24" y="25" fill="#8b9cac" font-size="11" font-weight="700" letter-spacing="1.3">DATA · RUNTIME · INTEGRATIONS</text>
      <g transform="translate(24 39)" fill="#f0f7fb" stroke="#d9e7ef">
        <rect width="190" height="38" rx="9"/>
        <rect x="202" width="190" height="38" rx="9"/>
        <rect x="404" width="190" height="38" rx="9"/>
        <rect x="606" width="190" height="38" rx="9"/>
        <rect x="808" width="224" height="38" rx="9"/>
      </g>
      <g transform="translate(24 39)" fill="#355f78" font-size="12" font-weight="600" text-anchor="middle">
        <text x="95" y="24">MySQL 8</text>
        <text x="297" y="24">Workspace Files</text>
        <text x="499" y="24">LLM Providers</text>
        <text x="701" y="24">MCP · LSP</text>
        <text x="920" y="24">SMTP · Embedding Runtime</text>
      </g>
    </g>
  </g>

  <rect x="58" y="72" width="206" height="5" rx="2.5" fill="url(#accent)"/>
</svg>
